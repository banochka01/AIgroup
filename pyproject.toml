[project]
name = "jarvis-multiagent"
version = "0.1.0"
description = "Production-ready Telegram multi-agent AI workspace orchestrator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.0",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.29.0",
  "greenlet>=3.0.0",
  "python-telegram-bot>=21.0",
  "httpx>=0.27.0",
  "openai>=1.66.0",
  "tenacity>=9.0.0",
]

[project.scripts]
jarvis-telegram = "jarvis_multiagent.telegram.runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
